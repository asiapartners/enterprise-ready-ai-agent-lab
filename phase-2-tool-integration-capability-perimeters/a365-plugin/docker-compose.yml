## OpenClaw A365 Channel Plugin — Docker Compose
##
## Quick Start:
##   1. cp .env.example .env
##   2. Fill in all required values in .env
##   3. docker-compose up -d

services:
  openclaw-a365:
    image: ghcr.io/sidu/openclaw-a365:latest
    # Uncomment to build from source instead:
    # build: .
    container_name: openclaw-a365
    restart: unless-stopped

    ## NET_ADMIN is only required when NETWORK_MODE != unrestricted
    ## It allows iptables rules for capability perimeter enforcement
    cap_add:
      - NET_ADMIN

    ports:
      ## Port 3978: Microsoft Bot Framework webhook endpoint
      - "3978:3978"

    env_file:
      - .env

    volumes:
      ## Persists conversation references and session data across container restarts
      - openclaw-data:/root/.openclaw

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18789/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  openclaw-data:
    name: openclaw-a365-data
